<body>
<div class="wrap">

  <header class="site-header">
    <a class="site-brand" href="index.html">
      <img src="assets/images/logo.png" alt="Bálint Mazzag logo">
    </a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="https://blog.balintmazzag.com" target="_blank" rel="noopener">Blog</a>
      <a href="publications.html" class="active">Publications</a>
      <a href="https://github.com/mbalint9901" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <h1 class="page-title">Publications</h1>

  <!-- Publications are loaded from publications.json — edit that file to add real entries,
       no HTML editing needed. Format:
       [{ "title": "...", "venue": "...", "year": 2025, "link": "https://..." }] -->
  <p class="intro">
    Peer-reviewed and preprint research.
  </p>

  <div class="pub-list" id="pub-list"></div>

  <footer class="site-footer">© 2026</footer>

</div>

<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadPublications() {
    const container = document.getElementById('pub-list');
    try {
      const res = await fetch('assets/data/publications.json');
      const pubs = await res.json();

      if (!Array.isArray(pubs) || pubs.length === 0) {
        container.innerHTML = `
          <div class="pub-row" style="cursor: default;">
            <div class="pub-title">Publications will be listed here soon</div>
          </div>`;
        return;
      }

      const sorted = [...pubs].sort((a, b) => (b.year || 0) - (a.year || 0));

      container.innerHTML = sorted.map(pub => `
        <a class="pub-row" href="${escapeHtml(pub.link || '#')}" target="_blank" rel="noopener">
          <div class="pub-title">${escapeHtml(pub.title || 'Untitled')}</div>
          <div class="pub-meta">${escapeHtml(pub.venue || '')} | ${escapeHtml(String(pub.year || ''))}${pub.citedBy ? ` | Cited by ${escapeHtml(String(pub.citedBy))}` : ''}</div>
        </a>
      `).join('');
    } catch (err) {
      container.innerHTML = `
        <div class="pub-row" style="cursor: default;">
          <div class="pub-title">Could not load publications.</div>
        </div>`;
      console.error('Failed to load publications.json', err);
    }
  }

  loadPublications();
</script>
</body>
</html>
